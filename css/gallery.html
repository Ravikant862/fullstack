<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            gap: 10px;
            background-color: bisque;
            

        }
        .box{
            display:flex;
            justify-content:center;
            align-items:center;
            color:rgb(165, 47, 47);
            background:#2d5c63;
            border-radius:10px;
            height: 100px;
            gap: 10px;

        }

    </style>
</head>
<body>
    <div class="container"></div>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
    <div class="box">9</div>
</body>
</html>
