<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#0a1a28,#00f2fe);
        }

        .login-container{
            background:#fff;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .login-container h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#555;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#4facfe;
            outline:none;
            box-shadow:0 0 5px rgba(79,172,254,.5);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:14px;
            margin-bottom:20px;
        }

        .options a{
            text-decoration:none;
            color:#4facfe;
        }

        .options a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#4facfe;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2b8df5;
        }

        .signup{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .signup a{
            color:#4facfe;
            text-decoration:none;
            font-weight:bold;
        }

        .signup a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>

</body>
</html>
