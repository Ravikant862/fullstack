<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .login-box {
            width: 250px;
            margin: auto;
            padding: 20px;
            border: 1px ;
            background-color: blanchedalmond;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px ;
        }

        button {
            width: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username" required><br>
            <input type="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
