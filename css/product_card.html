<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
        }

        .card {
            width: 200px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            padding: 15px;
        }

        .card img {
            width: 100%;
            border-radius: 5px;
        }

        .card h3 {
            margin: 10px 0;
        }

        .price {
            color: green;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            padding: 8px 15px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
       
        <h3>Product 1</h3>
        <p class="price">$25</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <
        <h3>Product 2</h3>
        <p class="price">$40</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        
        <h3>Product 3</h3>
        <p class="price">$60</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
