<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            
            outline: 2px solid black;
            display: flex;
            flex-direction: row;
            border-radius: 20px;
            flex-wrap: wrap;
            
            
            
              }
        .container>div{
            background-color: black;
            color: white;
            width: 100px;
            flex-basis: 100px;
            text-align: center;
            height: 100px;
            align-content: center;
            margin: 10px;
            
            
        }
        #box1{
            border-radius: 20px;
            background-color: green;
            flex: 2 0 150px;
            
        }
        #box2{
            border-radius: 20px;
            background-color: red;
            flex: 2 0 150px;
        }
        #box3{
            border-radius: 20px;
            background-color:  blue;
           flex: 2 0 150px;
        }
        #box4{
            border-radius: 20px;
            background-color: rgb(3, 54, 3);
            flex: 2 0 150px;
            
        }
        #box5{
            border-radius: 20px;
            background-color: rgb(224, 220, 220);
            flex: 2 0 150px;
        }
        #box6{
            border-radius: 20px;
            background-color:  rgb(178, 178, 241);
           flex: 2 0 150px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
    
</body>
</html>
