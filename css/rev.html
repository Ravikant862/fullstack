<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card{
        margin: auto;
        box-shadow: 3px 3px 5px grey;
        padding: 1%;
        width: 200px;
    }
    .card__img{margin: auto;}
    .card__text{font-weight: 900;
    font-family: Arial, Helvetica, sans-serif;
    }
    .card__button{
        background-color: black;
        color: white;
    }
    .parent{
        container-type: inline-size;
        container-name: parent;
        margin: auto;
        box-shadow: 3px 3px 3px black;
        padding: 1%;
    }
    @container parent  (max-width:800px){
        .child{
            background-color: black;
            color: white;
        }
    }
</style>
<body>
    <div class="card">
        <img src="https://picsum.photos/seed/picsum/200/300" class="card__img">
        <p class="card__text">Static Random Image</p>
        <button class="card__button">read more</button>
    </div> 
    <div class="parent">
        <div class="child">
            <p class="card__text">Loren Ipsum</p>
        </div>
    </div>
</body>
</html>
