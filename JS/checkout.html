
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1, h2 {
            color: #222;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .product p {
            margin: 5px 0;
            color: #555;
        }

        input {
            width: 55px;
            padding: 7px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .remove {
            background: #dc2626;
        }

        .suggestion {
            margin: 10px 0;
        }

        .summary p {
            display: flex;
            justify-content: space-between;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            padding-top: 12px;
        }

        .discount input {
            width: 110px;
        }

        .checkout {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            font-size: 16px;
        }

        @media (max-width: 650px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1 style="text-align:center">Shopping Checkout</h1>

<div class="container">

    <div>
        <div class="box">
            <h2>Your Products</h2>
            <div id="products"></div>
        </div>

        <div class="box">
            <h2>Suggested Products</h2>
            <div id="suggestions"></div>
        </div>
    </div>

    <div class="box summary">
        <h2>Checkout Summary</h2>

        <p>Subtotal: <span id="subtotal">₹0</span></p>
        <p>Discount: <span id="discount">₹0</span></p>
        <p>Delivery: <span id="delivery">₹0</span></p>

        <p class="total">
            Total: <span id="total">₹0</span>
        </p>

        <div class="discount">
            <input id="coupon" placeholder="SAVE10">
            <button onclick="applyDiscount()">Apply</button>
            <p id="message"></p>
        </div>

        <button class="checkout" onclick="placeOrder()">
            Place Order
        </button>
    </div>

</div>

<script>
    let products = [
        { id: 1, name: "Wireless Mouse", price: 500, qty: 1 },
        { id: 2, name: "Keyboard", price: 800, qty: 1 },
        { id: 3, name: "Headphones", price: 1200, qty: 1 }
    ];

    const suggestions = [
        { id: 4, name: "USB Cable", price: 200 },
        { id: 5, name: "Laptop Stand", price: 600 }
    ];

    let discountPercent = 0;

    function renderProducts() {
        const container = document.getElementById("products");
        container.innerHTML = "";

        products.forEach(product => {
            container.innerHTML += `
                <div class="product">
                    <div>
                        <strong>${product.name}</strong>
                        <p>₹${product.price} each</p>
                    </div>

                    <div>
                        <input type="number" min="1"
                            value="${product.qty}"
                            onchange="changeQty(${product.id}, this.value)">
                        <p>₹${product.price * product.qty}</p>
                        <button class="remove"
                            onclick="removeProduct(${product.id})">
                            Remove
                        </button>
                    </div>
                </div>
            `;
        });

        if (products.length === 0) {
            container.innerHTML = "<p>Your cart is empty.</p>";
        }

        renderSuggestions();
        updateSummary();
    }

    function renderSuggestions() {
        const container = document.getElementById("suggestions");
        container.innerHTML = "";

        suggestions.forEach(product => {
            const alreadyAdded = products.some(p => p.id === product.id);

            if (!alreadyAdded) {
                container.innerHTML += `
                    <div class="suggestion">
                        ${product.name} - ₹${product.price}
                        <button onclick="addProduct(${product.id})">
                            Add
                        </button>
                    </div>
                `;
            }
        });

        if (container.innerHTML === "") {
            container.innerHTML = "<p>All suggestions added!</p>";
        }
    }

    function changeQty(id, quantity) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        product.qty = Math.max(1, parseInt(quantity) || 1);
        renderProducts();
    }

    function removeProduct(id) {
        products = products.filter(p => p.id !== id);
        renderProducts();
    }

    function addProduct(id) {
        const product = suggestions.find(p => p.id === id);

        if (product && !products.some(p => p.id === id)) {
            products.push({ ...product, qty: 1 });
            renderProducts();
        }
    }

    function applyDiscount() {
        const coupon = document.getElementById("coupon")
            .value.trim().toUpperCase();

        const message = document.getElementById("message");

        if (coupon === "SAVE10") {
            discountPercent = 10;
            message.textContent = "10% discount applied!";
            message.style.color = "green";
        } else {
            discountPercent = 0;
            message.textContent = "Invalid coupon code.";
            message.style.color = "red";
        }

        updateSummary();
    }

    function updateSummary() {
        const subtotal = products.reduce(
            (sum, p) => sum + p.price * p.qty, 0
        );

        const discountAmount = subtotal * discountPercent / 100;
        const deliveryFee = subtotal === 0 || subtotal >= 2000 ? 0 : 50;
        const total = subtotal - discountAmount + deliveryFee;

        document.getElementById("subtotal").textContent =
            "₹" + subtotal.toFixed(2);

        document.getElementById("discount").textContent =
            "-₹" + discountAmount.toFixed(2);

        document.getElementById("delivery").textContent =
            "₹" + deliveryFee.toFixed(2);

        document.getElementById("total").textContent =
            "₹" + total.toFixed(2);
    }

    function placeOrder() {
        if (products.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        alert("Order placed successfully! (Demo only)");
    }

    renderProducts();
</script>

</body>
</html>
